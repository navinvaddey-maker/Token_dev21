<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Token Compress Engine — CRISP framework powered token optimization">
    <title>TokenSqueeze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <style>
        :root {
            /* Variables mapping the color palette */
            --page-bg: #f0f0ec;
            --glass-bg: rgba(255, 255, 255, 0.62);
            --glass-border: rgba(255, 255, 255, 0.82);
            --btn-grad: linear-gradient(135deg, #ffd740, #f5a800);
            --btn-text: #2a1a00;
            --accent-text: #9a7c00;
            --head-text: #111111;
            --body-text: #6b6b6b;
            --stat-pos: #b07a00;
            --inp-border: rgba(200, 170, 0, 0.28);
            --inp-focus: rgba(200, 140, 0, 0.60);
            --inp-ring: rgba(255, 210, 0, 0.12);
            --prog-fill: linear-gradient(90deg, #ffd740, #f5a800);
            --prog-track: rgba(200, 170, 0, 0.15);
            --tag-bg: rgba(255, 210, 0, 0.18);
            --tag-text: #9a7000;
            --divider: rgba(200, 170, 0, 0.15);
            --copy-bg: rgba(255, 220, 0, 0.12);
            --copy-border: rgba(200, 170, 0, 0.25);
            --danger: #e63946;
            --success: #2a9d8f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--page-bg);
            color: var(--body-text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Page Layout ──────────────────────── */
        .tc-root {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 48px 24px 64px;
            position: relative;
            overflow: hidden;
        }

        /* ── Decorative Bubbles ───────────────── */
        .bubble {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            z-index: 0;
            pointer-events: none;
        }
        .bubble-1 {
            width: 340px;
            height: 340px;
            top: -100px;
            left: -100px;
            opacity: 0.82;
            background: radial-gradient(circle at 35% 35%, #ffe066, #f5a800cc);
            animation: floatA 8s ease-in-out infinite;
        }
        .bubble-2 {
            width: 260px;
            height: 260px;
            bottom: -80px;
            right: -60px;
            opacity: 0.75;
            background: radial-gradient(circle at 40% 30%, #ffd740, #f59e00bb);
            animation: floatB 10s ease-in-out infinite;
        }

        @keyframes floatA {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(18px, 24px) scale(1.04); }
        }
        @keyframes floatB {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-14px, -20px) scale(1.06); }
        }

        /* ── Glass Card ───────────────────────── */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(28px) saturate(1.6);
            -webkit-backdrop-filter: blur(28px) saturate(1.6);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 40px 44px;
            box-shadow:
                0 4px 32px rgba(180, 140, 0, 0.08),
                0 1px 4px rgba(0, 0, 0, 0.04);
            max-width: 720px;
            width: 100%;
            position: relative;
            z-index: 2;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* ── Logo ─────────────────────────────── */
        .tc-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .tc-logo-icon {
            width: 36px;
            height: 36px;
            background: var(--btn-grad);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 12px rgba(245, 168, 0, 0.35);
        }
        .tc-logo-text {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.3px;
        }
        .tc-logo-text span {
            color: #c88000;
        }

        /* ── Typography ───────────────────────── */
        .tc-headline {
            font-family: 'Syne', sans-serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--head-text);
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin: 0 0 6px;
        }
        .tc-sub {
            font-size: 14px;
            font-weight: 400;
            color: var(--body-text);
            margin: 0 0 28px;
        }
        .section-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: var(--accent-text);
            margin-bottom: 8px;
            margin-top: 16px;
        }
        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            background: var(--tag-bg);
            color: var(--tag-text);
            margin-bottom: 16px;
        }

        /* ── Forms, Inputs, Textareas ─────────── */
        form { margin-bottom: 0; }
        .form-row { margin-bottom: 16px; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .tc-input {
            width: 100%;
            padding: 12px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            color: #1a1a1a;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid var(--inp-border);
            border-radius: 10px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .tc-input:focus {
            border-color: var(--inp-focus);
            box-shadow: 0 0 0 3px var(--inp-ring);
        }
        .tc-input::placeholder { color: #aaa; }

        .tc-textarea {
            width: 100%;
            min-height: 100px;
            padding: 14px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            line-height: 1.65;
            color: #1a1a1a;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid var(--inp-border);
            border-radius: 14px;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .tc-textarea:focus {
            border-color: var(--inp-focus);
            box-shadow: 0 0 0 3px var(--inp-ring);
        }
        .tc-textarea::placeholder { color: #bbb; }
        #prompt-input { min-height: 140px; }

        .select-wrap {
            position: relative;
            flex: 1;
            min-width: 140px;
        }
        .tc-select {
            width: 100%;
            appearance: none;
            padding: 12px 36px 12px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            background: rgba(255, 255, 255, 0.80);
            border: 1px solid var(--inp-border);
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .tc-select:focus {
            border-color: var(--inp-focus);
            box-shadow: 0 0 0 3px var(--inp-ring);
        }
        .select-chevron {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #bba000;
            font-size: 10px;
        }

        /* ── Buttons ──────────────────────────── */
        .tc-compress-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 28px;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--btn-text);
            background: var(--btn-grad);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 2px 16px rgba(245, 168, 0, 0.32);
            transition: transform 0.15s, box-shadow 0.15s;
            margin-top: 10px;
        }
        .tc-compress-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(245, 168, 0, 0.42);
        }
        .tc-compress-btn:active {
            transform: scale(0.98);
        }

        .clear-btn {
            padding: 10px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            color: #888;
            background: rgba(255, 255, 255, 0.60);
            border: 1px solid rgba(0, 0, 0, 0.10);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .clear-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #444;
        }

        .copy-btn {
            padding: 7px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent-text);
            background: var(--copy-bg);
            border: 1px solid var(--copy-border);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .copy-btn:hover {
            background: rgba(255, 210, 0, 0.22);
        }
        .btn-success-sm {
            padding: 7px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            background: #2a9d8f;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-success-sm:hover { background: #21867a; }
        
        .btn-danger-sm {
            padding: 7px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            background: #e76f51;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-danger-sm:hover { background: #d65b3f; }

        .btn-ghost {
            background: transparent;
            border: 1px solid rgba(200, 170, 0, 0.3);
            color: #888;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-ghost:hover {
            background: rgba(200, 170, 0, 0.1);
            color: #222;
        }


        /* ── Auth Tabs ────────────────────────── */
        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: rgba(255, 210, 0, 0.1);
            padding: 4px;
            border-radius: 12px;
        }
        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: none;
            background: transparent;
            color: #888;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .auth-tab.active {
            background: #fff;
            color: var(--head-text);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .auth-form { display: none; animation: fadeIn 0.3s ease; }
        .auth-form.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Nav Tabs ─────────────────────────── */
        .nav-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--divider);
            padding-bottom: 12px;
        }
        .nav-tab {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: #888;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }
        .nav-tab:hover { color: #444; }
        .nav-tab.active {
            color: var(--accent-text);
            font-weight: 600;
        }
        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -13px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--btn-grad);
            border-radius: 2px 2px 0 0;
        }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }

        /* ── User Bar ─────────────────────────── */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(200, 170, 0, 0.15);
        }
        .user-info {
            font-size: 13px;
            color: #666;
        }
        .user-info strong {
            color: #1a1a1a;
            font-weight: 600;
        }

        /* ── Stat Cards ───────────────────────── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 24px 0;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.58);
            border: 1px solid rgba(255, 220, 0, 0.22);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }
        .stat-val {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1;
            margin-bottom: 6px;
        }
        .stat-val.positive {
            color: var(--stat-pos);
        }
        .stat-lbl {
            font-size: 11px;
            color: #888;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ── Progress Bar ─────────────────────── */
        .progress-bar-wrap {
            height: 6px;
            background: var(--prog-track);
            border-radius: 99px;
            overflow: hidden;
            margin: 10px 0 4px;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--prog-fill);
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #999;
            margin-bottom: 16px;
        }

        /* ── Output Box ───────────────────────── */
        .output-box {
            background: rgba(255, 255, 255, 0.62);
            border: 1px solid rgba(200, 170, 0, 0.22);
            border-radius: 14px;
            padding: 20px;
            font-size: 13.5px;
            line-height: 1.7;
            color: #2a2a2a;
            min-height: 80px;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-word;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
        }
        .output-box.empty {
            color: #ccc;
            font-family: 'DM Sans', sans-serif;
            font-style: italic;
            font-size: 13px;
        }
        .feedback-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        /* ── Divider ──────────────────────────── */
        hr.divider {
            border: none;
            border-top: 1px solid var(--divider);
            margin: 24px 0;
        }

        /* ── History Items ────────────────────── */
        .history-item {
            padding: 16px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--divider);
            border-radius: 12px;
            margin-bottom: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .history-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(200, 170, 0, 0.1);
            border-color: rgba(200, 140, 0, 0.4);
        }
        .history-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #777;
            margin-top: 8px;
        }

        /* ── Toast ────────────────────────────── */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 380px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            backdrop-filter: blur(10px);
        }
        .toast-error { 
            background: rgba(230, 57, 70, 0.9);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .toast-success { 
            background: rgba(42, 157, 143, 0.9);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Loading */
        .loading { opacity: 0.7; pointer-events: none; }
        
        /* ── Responsive ───────────────────────── */
        @media (max-width: 640px) {
            .glass-card { padding: 30px 20px; border-radius: 20px; }
            .tc-root { padding: 24px 16px 40px; }
            .stats-row { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
            .tc-headline { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="tc-root">
    <!-- Decorative background elements -->
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>

    <div class="glass-card">
        
        <!-- Header -->
        <div class="tc-logo">
            <div class="tc-logo-icon">✨</div>
            <div class="tc-logo-text">Token<span>Squeeze</span></div>
        </div>
        <h1 class="tc-headline">Token Compress Engine</h1>
        <p class="tc-sub">CRISP framework · Six neuroscience principles · Feedback learning</p>

        <!-- ── Auth Section ──────────────────────────────── -->
        <div id="auth-section">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')" id="tab-login">Login</button>
                <button class="auth-tab" onclick="switchAuthTab('register')" id="tab-register">Register</button>
            </div>

            <!-- Login Form -->
            <form class="auth-form active" id="form-login" onsubmit="handleLogin(event)">
                <div class="form-row">
                    <label for="login-username" class="section-label">Username</label>
                    <input type="text" id="login-username" class="tc-input" placeholder="Enter username" required>
                </div>
                <div class="form-row">
                    <label for="login-password" class="section-label">Password</label>
                    <input type="password" id="login-password" class="tc-input" placeholder="Enter password" required>
                </div>
                <button type="submit" class="tc-compress-btn" id="login-btn">Sign In</button>
            </form>

            <!-- Register Form -->
            <form class="auth-form" id="form-register" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <label for="reg-username" class="section-label">Username</label>
                    <input type="text" id="reg-username" class="tc-input" placeholder="Choose a username" required>
                </div>
                <div class="form-row">
                    <label for="reg-email" class="section-label">Email</label>
                    <input type="email" id="reg-email" class="tc-input" placeholder="your@email.com" required>
                </div>
                <div class="form-row">
                    <label for="reg-password" class="section-label">Password</label>
                    <input type="password" id="reg-password" class="tc-input" placeholder="Choose a password" required>
                </div>
                <div class="form-row">
                    <label for="reg-business" class="section-label">Business Type</label>
                    <div class="select-wrap">
                        <select id="reg-business" class="tc-select">
                            <option value="Developer">Developer</option>
                            <option value="Business">Business</option>
                            <option value="Researcher">Researcher</option>
                            <option value="Legal">Legal</option>
                            <option value="Finance">Finance</option>
                        </select>
                        <div class="select-chevron">▼</div>
                    </div>
                </div>
                <button type="submit" class="tc-compress-btn" id="register-btn">Create Account</button>
            </form>
        </div>

        <!-- ── Main Section ──────────────────────────────── -->
        <div id="main-section" style="display: none;">
            <div class="user-bar">
                <div class="user-info">Signed in as <strong id="display-username"></strong></div>
                <div style="display: flex; gap: 8px;">
                    <a href="/admin.html" id="admin-link" class="btn-ghost" style="display: none; text-decoration: none;">🛡️ Admin</a>
                    <button class="btn-ghost" onclick="logout()">Sign Out</button>
                </div>
            </div>

            <div class="nav-bar">
                <button class="nav-tab active" onclick="switchTab('compress')" id="nav-compress">Compress</button>
                <button class="nav-tab" onclick="switchTab('history')" id="nav-history">History</button>
                <button class="nav-tab" onclick="switchTab('stats')" id="nav-stats">Stats</button>
            </div>

            <!-- ── Compress Tab ── -->
            <div class="tab-content active" id="tab-compress">
                <div class="tag">CRISP Optimization</div>
                
                <div class="form-row">
                    <label for="prompt-input" class="section-label">Raw Prompt</label>
                    <textarea id="prompt-input" class="tc-textarea" placeholder="Paste your lengthy prompt here..."></textarea>
                </div>
                
                <div class="form-row" style="display: none;">
                    <label for="task-input" class="section-label">Task Description</label>
                    <input type="text" id="task-input" class="tc-input" placeholder="What should the AI do with this prompt?" value="Optimize prompt">
                </div>


                <div class="form-grid">
                    <div class="form-row">
                        <label for="model-select" class="section-label">Target Model</label>
                        <div class="select-wrap">
                            <select id="model-select" class="tc-select">
                                <option value="Claude" selected>Claude</option>
                                <option value="ChatGPT">ChatGPT</option>
                                <option value="Copilot">Copilot</option>
                            </select>
                            <div class="select-chevron">▼</div>
                        </div>
                    </div>
                    <div class="form-row">
                        <label for="mode" class="section-label">Compression Mode</label>
                        <div class="select-wrap">
                            <select id="mode" class="tc-select">
                                <option value="balanced">Balanced</option>
                                <option value="gentle">Gentle</option>
                                <option value="aggressive">Aggressive</option>
                            </select>
                            <div class="select-chevron">▼</div>
                        </div>
                    </div>
                </div>

                <div class="form-row" style="display:none;">
                    <label for="use-case">Use Case</label>
                    <select id="use-case">
                        <option value="">Auto-detect</option>
                        <option value="generic">Generic</option>
                        <option value="code">Code</option>
                        <option value="ticket">Support Ticket</option>
                        <option value="legal">Legal</option>
                        <option value="resume">Resume</option>
                        <option value="research">Research</option>
                        <option value="transcript">Transcript</option>
                        <option value="financial">Financial</option>
                    </select>
                </div>

                <button class="tc-compress-btn" onclick="compress()" id="compress-btn">
                    ⚡ Compress Prompt
                </button>

                <!-- Result Section -->
                <div id="result-section" style="display:none;">
                    <hr class="divider">
                    
                    <div class="stats-row">
                        <div class="stat-card">
                            <div class="stat-val" id="stat-original">0</div>
                            <div class="stat-lbl">Original Tokens</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-val" id="stat-final">0</div>
                            <div class="stat-lbl">Final Tokens</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-val positive" id="stat-saved">0</div>
                            <div class="stat-lbl">Tokens Saved</div>
                        </div>
                    </div>
                    
                    <div class="section-label">Optimized Prompt (CRISP)</div>
                    <div class="output-box" id="result-output"></div>
                    
                    <div class="feedback-row">
                        <button class="btn-success-sm" onclick="submitFeedback('thumbs_up')">👍 Useful</button>
                        <button class="btn-danger-sm" onclick="submitFeedback('thumbs_down')">👎 Not Useful</button>
                        <button class="copy-btn" onclick="copyResult()">📋 Copy</button>
                    </div>
                </div>
            </div>

            <!-- ── History Tab ── -->
            <div class="tab-content" id="tab-history-content">
                <div class="section-label">Compression History</div>
                <div id="history-list"></div>
            </div>

            <!-- ── Stats Tab ── -->
            <div class="tab-content" id="tab-stats-content">
                <div class="section-label">Usage Statistics</div>
                <div class="stats-row" id="global-stats"></div>
            </div>

        </div> <!-- End Main Section -->

    </div> <!-- End Glass Card -->
</div>

<script src="dev_engine.js"></script>
<script src="prompt_optimizer.js"></script>
<script src="mock_api.js"></script>
<script src="app.js"></script>

</body>
</html>
