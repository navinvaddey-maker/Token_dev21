<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Link Test</title>
</head>
<body>
    <div id="test-result">Testing admin link visibility...</div>
    <div id="admin-link" style="display: none;">
        <a href="/admin.html" id="admin-link-inner" class="btn btn-ghost btn-sm" style="text-decoration: none;">🛡️ Admin</a>
    </div>
    
    <script>
        // Simulate the State object from app.js
        const State = {
            token: null,
            userId: null,
            username: null,
            businessType: null
        };

        // Simulate login response
        function simulateLogin() {
            // This is what we got from the actual login API
            const loginResponse = {
                "token": "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI2ZmQ4ZDYxNC04ZmViLTQyNjYtODY5Yy01ZjVkZGIxNGY0YzQiLCJleHAiOjE3NzUzMDYzMjF9.13lBHgMYeaCwJ2H_OqZ5zY1wc9IpiQWngdSsFUpjST8",
                "user_id": "6fd8d614-8feb-4266-869c-5f5ddb14f4c4",
                "username": "navin",
                "business_type": "Admin"  // Note: capital "A"
            };
            
            console.log('Simulating login with response:', loginResponse);
            
            // This is the exact code from handleLogin function
            State.token = loginResponse.token;
            State.userId = loginResponse.user_id;
            State.username = loginResponse.username;
            localStorage.setItem('tce_token', loginResponse.token);
            localStorage.setItem('tce_user_id', loginResponse.user_id);
            localStorage.setItem('tce_username', loginResponse.username);
            localStorage.setItem('tce_business_type', loginResponse.business_type);
            State.businessType = loginResponse.business_type;  // Fixed: was data.businessType
            
            console.log('State after login:', State);
            console.log('State.businessType:', State.businessType);
            console.log('Typeof State.businessType:', typeof State.businessType);
            
            // This is the exact code from showMainSection function
            console.log('Showing main section. businessType:', `"${State.businessType}"`, 'Length:', State.businessType ? State.businessType.length : 'null');
            console.log('Trimmed and lowercased:', `"${State.businessType && State.businessType.trim().toLowerCase()}"`);
            
            if (State.businessType && State.businessType.trim().toLowerCase() === 'admin') {
                console.log('SHOWING admin link');
                document.getElementById('admin-link').style.display = 'inline-flex';
                document.getElementById('test-result').innerHTML = '<span style="color: green;">✅ PASS: Admin link should be VISIBLE</span>';
                document.getElementById('test-result').style.color = 'green';
            } else {
                console.log('HIDING admin link');
                document.getElementById('admin-link').style.display = 'none';
                document.getElementById('test-result').innerHTML = '<span style="color: red;">❌ FAIL: Admin link should be HIDDEN</span>';
                document.getElementById('test-result').style.color = 'red';
            }
        }
        
        // Run the test
        simulateLogin();
    </script>
