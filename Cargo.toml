[package]
name    = "token_compress_engine"
version = "0.1.0"
edition = "2021"


[workspace]
members = [
    ".",
    "crates/schema-engine",
    "crates/hebbian-core",
    "crates/competitive-core",
    "crates/db",
    "crates/learning-engine",
]
resolver = "2"

[dependencies]
edit-distance = "2.1"
# internal crates
schema-engine    = { path = "crates/schema-engine" }
hebbian-core     = { path = "crates/hebbian-core" }
competitive-core = { path = "crates/competitive-core" }
db               = { path = "crates/db" }
learning-engine  = { path = "crates/learning-engine" }

# web framework
axum        = { version = "0.7", features = ["macros", "multipart"] }
tokio       = { version = "1",   features = ["full"] }
tower       = { version = "0.4", features = ["util", "limit", "buffer"] }
tower-http  = { version = "0.5", features = ["trace", "cors", "fs"] }

# database — SQLite (transitioning to Postgres via db crate, but keeping here for current compilation)
sqlx        = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "macros", "json"] }

# auth
bcrypt      = "0.15"
jsonwebtoken = "9"

# serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# error handling
thiserror   = "1"
anyhow      = "1"
async-trait = "0.1"

# logging
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json"] }

# utilities
uuid      = { version = "1", features = ["v4", "serde"] }
chrono    = { version = "0.4", features = ["serde"] }
regex     = "1"
once_cell = "1"
dotenvy   = "0.15"
time      = { version = "0.3", features = ["serde"] }
urlencoding = "2.1"

# NEW: Token compression engine dependencies
arrayvec   = "0.7"          # stack-allocated fixed-capacity arrays (WM slots)
dashmap    = { version = "5",  features = ["serde"] }            # concurrent HashMap for schema priors
rayon      = "1"            # parallel salience scoring (sparse coding)
lazy_static = "1.4"
phf        = { version = "0.8", features = ["macros"] }          # perfect hash maps for domain phrase lookup

# RAG dependencies
pdf-extract = "0.7"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
